name: CI
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
on:
  workflow_dispatch:
  push:
    branches: [ master, main ]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install deps
        run: npm ci
      - name: Build (if present)
        run: npm run build --if-present
      - name: Lint (non-blocking)
        run: npm run lint --if-present
        continue-on-error: true
      # Højst to workers og 30 s i stedet for standardens 5 s: runneren har 8 kerner, der deles
      # med andre jobs, og vitest starter som standard en jsdom-worker pr. kerne minus én. Under belastning løb
      # tests ind i 5 s-grænsen (regnestykker, MomsBeregner) uden at være fejlbehæftede.
      - name: Test
        run: npm test --if-present -- --maxWorkers=2 --testTimeout=30000
