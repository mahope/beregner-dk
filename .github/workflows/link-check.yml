name: Link Check
on:
  push:
    branches: [ master, main ]
  pull_request:
  schedule:
    - cron: '30 3 * * 1' # Weekly Monday 03:30 UTC
jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Link check (Markdown + MDX)
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          # Kun rapport, blokerer ikke (tidligere fail = false i .lychee.toml, som lychee 0.24 afviser)
          fail: false
          output: .lychee/out.md
          args: >-
            --config .lychee.toml
            --accept 200,206,429
            --max-redirects 5
            --verbose
            --no-progress
            "**/*.md" "**/*.mdx"
      - name: Upload lychee report
        uses: https://code.forgejo.org/forgejo/upload-artifact@v4.3.1
        if: always()
        with:
          name: lychee-report
          path: .lychee/**
